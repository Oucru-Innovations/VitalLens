name: Release

# Đẩy tag `vX.Y.Z` → build MỘT file `VitalLens.exe` (Nuitka onefile) trên
# Windows sạch, quét secret, tạo GitHub Release.
#
# Vì sao build trên máy CI chứ không phải máy dev: máy dev có thể có `.env` thật
# cạnh repo. `build_nuitka.bat` mặc định từ chối trường hợp đó; runner còn kiểm
# tra lại ngay trước build nên bản phát hành luôn SẠCH — người dùng tự nhập
# API_UPLOAD_URL / API_BEARER_TOKEN qua dialog Cài đặt (ghi ra
# %APPDATA%\VitalLens\.env). Đây là khác biệt CỐ Ý so với build tay.
#
# LƯU Ý CHI PHÍ: repo private + runner Windows = hệ số 2x phút Actions. Nuitka
# phải biên dịch cả paddle nên lần đầu ~60-90 phút (≈120-180 phút bị tính).
# Cache Nuitka bên dưới kéo các lần sau xuống ~20-30 phút. Chỉ chạy khi tag,
# không chạy theo push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # chạy tay để kiểm tra build còn xanh, không phát hành

permissions:
  contents: write      # cần để `gh release create`

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Đọc version & đối chiếu với tag
        # Nguồn duy nhất của số version là apps/__init__.py. Tag lệch nghĩa là
        # quên bump — dừng ngay, đừng phát hành bản mang số cũ.
        shell: bash
        run: |
          v=$(python -c "import ast,pathlib;print(next(ast.literal_eval(n.value) for n in ast.parse(pathlib.Path('apps/__init__.py').read_text(encoding='utf-8')).body if isinstance(n,ast.Assign) and any(getattr(t,'id','')=='__version__' for t in n.targets)))")
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME khác __version__ ($v) trong apps/__init__.py"
            exit 1
          fi
          echo "Building VitalLens v$v"

      - name: Không file secret nào được commit
        shell: bash
        run: |
          tracked=$(git ls-files .env env config_debug.log)
          if [ -n "$tracked" ]; then
            echo "::error::File secret bị commit vào repo: $tracked"
            exit 1
          fi

      - name: Cài dependency vào .venv
        # build_nuitka.bat tự ưu tiên .venv\Scripts\python.exe (priority 2) nên
        # không phải sửa gì trong script build. KHÔNG cài vào python hệ thống:
        # rơi xuống priority 3 (`where python`) là bắt nhầm interpreter thiếu
        # Nuitka.
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements-build.txt

      - name: Cache PaddleX models
        uses: actions/cache@v6
        with:
          path: ~/.paddlex/official_models
          key: paddlex-PP-OCRv5_mobile_det-en_PP-OCRv5_mobile_rec

      - name: Cache Nuitka (ccache + object đã biên dịch)
        # Đây là thứ quyết định job chạy 90 phút hay 25 phút: gần hết thời gian
        # là biên dịch C của paddle, mà paddle chỉ đổi khi requirements.txt đổi.
        # Key theo requirements nên pin mới = dựng lại từ đầu, đúng như mong đợi.
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-${{ hashFiles('requirements*.txt') }}
          restore-keys: nuitka-

      - name: Tải sẵn OCR models
        # build_nuitka.bat đóng gói model từ %USERPROFILE%\.paddlex\official_models.
        # Gọi thẳng _get_ocr() để khỏi chép lại tên/tham số model ở đây — sửa
        # model trong xray.py là bước này tự theo.
        run: .venv\Scripts\python -c "from apps.logging_setup import setup_logging; setup_logging(); from apps.processing.xray import _get_ocr; _get_ocr()"

      - name: Build (Nuitka onefile)
        # Gọi thẳng build_nuitka.bat để mọi cờ Nuitka chỉ khai ở MỘT chỗ — sửa
        # cờ trong .bat là CI theo ngay. Cổng chặn secret trong dist_nuitka\
        # cũng nằm sẵn trong đó, không dựng lại ở đây.
        #
        # Xoá CONDA_PREFIX: runner có sẵn Miniconda, mà .bat ưu tiên
        # %CONDA_PREFIX%\python.exe (priority 1) — để nguyên là nó bắt python
        # của conda base, nơi không có Nuitka, rồi chết ở bước kiểm tra.
        run: |
          if (Test-Path -LiteralPath ".env") {
            throw "Repo root có .env ngay trước build; dừng để không nhúng secret"
          }
          $env:VITALLENS_EMBED_ENV = "0"
          Remove-Item Env:CONDA_PREFIX -ErrorAction SilentlyContinue
          .\build_nuitka.bat

      - name: Đặt tên file theo version
        # Onefile nên không có gì để zip. Đổi tên để nhìn file là biết bản nào
        # (metadata version có sẵn trong exe nhưng phải mở Properties mới thấy).
        run: Move-Item dist_nuitka\VitalLens.exe "VitalLens_v$env:VERSION.exe"

      - name: Sinh manifest cập nhật
        # File này chỉ có version + link, KHÔNG có token. Muốn app tự báo bản
        # mới thì host nó ở một URL công khai rồi đặt UPDATE_MANIFEST_URL trong
        # .env của người dùng — repo đang private nên link asset của Release
        # đòi đăng nhập, không dùng trực tiếp được.
        shell: bash
        run: |
          printf '{"version": "%s", "url": "https://github.com/%s/releases/latest"}\n' \
            "$VERSION" "$GITHUB_REPOSITORY" > latest.json
          cat latest.json

      - name: Tạo GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" --generate-notes "VitalLens_v$env:VERSION.exe" latest.json
